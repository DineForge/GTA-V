[build]
  publish = "public"

# Serve the compiled engine and immutable game data through this site's origin.
# The upstream asset mirror remains necessary; the game is not an offline bundle.
[[redirects]]
  from = "/b/*"
  to = "https://gta5-87g.pages.dev/b/:splat"
  status = 200
[[redirects]]
  from = "/data/*"
  to = "https://gta5-87g.pages.dev/data/:splat"
  status = 200
[[redirects]]
  from = "/__chunks/*"
  to = "https://gta5-87g.pages.dev/__chunks/:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/b/*/game.wasm"
  [headers.values]
    Content-Type = "application/wasm"
